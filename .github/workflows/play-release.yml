name: Upload to Play Internal Testing

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Wear OS track for the watch face'
        type: string
        default: 'wear:internal'
      mobile_track:
        description: 'Track for the phone companion'
        type: string
        default: 'internal'

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version_info.outputs.version_name }}
      mobile_version_code: ${{ steps.version_info.outputs.mobile_version_code }}
      watchface_version_code: ${{ steps.version_info.outputs.watchface_version_code }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Ensure local.properties is not used in CI
        run: rm -f local.properties

      - name: Grant rights
        run: chmod +x gradlew

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Get Version Info
        id: version_info
        run: |
          BASE_CODE=$(grep -E '^baseVersionCode=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          VERSION_NAME=$(grep -E '^baseVersionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if ! [[ "$BASE_CODE" =~ ^[0-9]+$ ]]; then
            echo "Error: could not read a numeric baseVersionCode from gradle.properties (got '$BASE_CODE')"
            exit 1
          fi
          if [ -z "$VERSION_NAME" ]; then
            echo "Error: could not read baseVersionName from gradle.properties"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "mobile_version_code=$((BASE_CODE * 10 + 2))" >> "$GITHUB_OUTPUT"
          echo "watchface_version_code=$((BASE_CODE * 10 + 3))" >> "$GITHUB_OUTPUT"

      - name: Collect the unsigned bundles and the listing
        env:
          OUT: ${{ runner.temp }}/out
          MOBILE_VERSION_CODE: ${{ steps.version_info.outputs.mobile_version_code }}
          WATCHFACE_VERSION_CODE: ${{ steps.version_info.outputs.watchface_version_code }}
        run: |
          mkdir -p "$OUT"
          for module in watchface mobile; do
            BUNDLE="$module/build/outputs/bundle/release/$module-release.aab"
            if [ ! -f "$BUNDLE" ]; then
              echo "Error: $BUNDLE was not built. Every form factor must ship in the release."
              exit 1
            fi
            cp "$BUNDLE" "$OUT/$module-release.aab"
          done
          for LOCALE in fastlane/metadata/android/*/; do
            for CODE in "$MOBILE_VERSION_CODE" "$WATCHFACE_VERSION_CODE"; do
              CHANGELOG_FILE="${LOCALE}changelogs/${CODE}.txt"
              if [ ! -f "$CHANGELOG_FILE" ]; then
                echo "Error: $CHANGELOG_FILE is missing. Write the release notes before releasing."
                exit 1
              fi
            done
          done
          cp -R fastlane/metadata/android "$OUT/metadata"

      - name: Store the unsigned bundle for the publish job
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-aabs-and-listing
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch the unsigned bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-aabs-and-listing
          path: ${{ runner.temp }}/in

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sign the bundles
        id: sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$ALIAS" ]; then
            echo "Error: signing secrets are not set."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$KEYSTORE"' EXIT
          ( umask 077; printf '%s' "$SIGNING_KEY" | base64 -d > "$KEYSTORE" )

          for module in watchface mobile; do
            AAB="$RUNNER_TEMP/in/$module-release.aab"
            if [ ! -f "$AAB" ]; then
              echo "Error: $AAB did not travel with the build job."
              exit 1
            fi
            jarsigner -verbose \
              -keystore "$KEYSTORE" \
              -storepass:env KEY_STORE_PASSWORD \
              -keypass:env KEY_PASSWORD \
              "$AAB" "$ALIAS"
          done

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane -v 2.240.1 --no-document

      - name: Upload the watch face to the Wear OS track
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track }}
          IN: ${{ runner.temp }}/in
          METADATA: ${{ runner.temp }}/in/metadata
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          WATCHFACE_VERSION_CODE: ${{ needs.build.outputs.watchface_version_code }}
        run: |
          if [ -z "$SUPPLY_JSON_KEY_DATA" ]; then
            echo "Error: PLAY_SERVICE_ACCOUNT_JSON secret is not set."
            exit 1
          fi
          if [ ! -d "$METADATA" ]; then
            echo "Error: the listing metadata did not travel with the bundles."
            exit 1
          fi
          echo "Uploading $VERSION_NAME to $TRACK: watch face $WATCHFACE_VERSION_CODE."
          echo "Listing texts: $(find "$METADATA" -mindepth 2 -maxdepth 2 -name '*.txt' -type f | wc -l) files"
          echo "Screenshots: $(find "$METADATA" -path '*/images/wearScreenshots/*' -type f | wc -l) files"
          fastlane supply \
            --package_name com.thomaskuenneth.c64watchface \
            --aab "$IN/watchface-release.aab" \
            --track "$TRACK" \
            --metadata_path "$METADATA"

      - name: Upload the phone companion to its own track
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.mobile_track }}
          IN: ${{ runner.temp }}/in
          METADATA: ${{ runner.temp }}/in/metadata
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          MOBILE_VERSION_CODE: ${{ needs.build.outputs.mobile_version_code }}
        run: |
          echo "Uploading $VERSION_NAME to $TRACK: phone companion $MOBILE_VERSION_CODE."
          fastlane supply \
            --package_name com.thomaskuenneth.c64watchface \
            --aab "$IN/mobile-release.aab" \
            --track "$TRACK" \
            --metadata_path "$METADATA" \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true

  cleanup:
    needs: [build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.build.outputs.artifact_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the bundle artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: gh api -X DELETE "repos/${REPO}/actions/artifacts/${ARTIFACT_ID}"
