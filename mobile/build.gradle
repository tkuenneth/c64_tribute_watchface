plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    alias libs.plugins.kotlin.serialization
    alias libs.plugins.aboutLibraries.android
}

android {
    compileSdk 37
    compileSdkMinor 1

    defaultConfig {
        applicationId "com.thomaskuenneth.c64watchface"
        minSdkVersion 24
        //noinspection EditedTargetSdkVersion
        targetSdkVersion 37
        versionCode project.findProperty("baseVersionCode").toString().toInteger() * 10 + 2
        versionName project.findProperty("baseVersionName").toString()
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        screenshots {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        release {
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    testOptions {
        unitTests {
            includeAndroidResources true
            all {
                jvmArgs(
                        '--add-opens=java.base/java.lang=ALL-UNNAMED',
                        '--add-opens=java.base/java.util=ALL-UNNAMED',
                        '--add-opens=java.base/java.io=ALL-UNNAMED',
                        '--add-opens=java.base/java.net=ALL-UNNAMED',
                        '--add-opens=java.base/java.security=ALL-UNNAMED',
                        '--add-opens=java.base/java.text=ALL-UNNAMED',
                        '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                        '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                        '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
                )
                systemProperty 'robolectric.conscryptMode', 'OFF'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    namespace 'com.thomaskuenneth.c64watchface'
}

dependencies {
    implementation project(":common")

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.navigation3.runtime
    implementation libs.androidx.navigation3.ui
    implementation libs.kotlinx.serialization.core
    implementation libs.androidx.activity.compose

    def composeBom = platform(libs.androidx.compose.bom)
    implementation composeBom
    androidTestImplementation composeBom
    testImplementation composeBom

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.ui.test.junit4

    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation libs.androidx.material.icons.core
    implementation libs.aboutlibraries.core
    implementation libs.aboutlibraries.compose.m3
    
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest

    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.preference.ktx
}

tasks.withType(Test).configureEach {
    inputs.files(fileTree("../watchface/src/main/res/raw"),
            fileTree(dir: "../watchface/src/main/res", includes: ["values*/strings.xml"]))
            .withPropertyName("watchFaceResources")
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
