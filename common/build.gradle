plugins {
    id 'com.android.library'
}

android {
    compileSdk 37

    defaultConfig {
        minSdk 19
        //noinspection EditedTargetSdkVersion
        targetSdk 37
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        screenshots {
            initWith release
            matchingFallbacks = ['release']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    namespace 'com.thomaskuenneth.common'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation libs.androidx.test.uiautomator
}

def wearScreenshotOutput = layout.buildDirectory
        .dir("outputs/connected_android_test_additional_output/debugAndroidTest/connected")

tasks.register("cleanWearScreenshotOutput", Delete) {
    group = "screenshots"
    description = "Removes screenshots pulled from an earlier capture, so only this run is copied."
    delete wearScreenshotOutput
}

tasks.matching { it.name == "connectedDebugAndroidTest" }.configureEach {
    mustRunAfter "cleanWearScreenshotOutput"
}

tasks.register("captureWearScreenshots", Copy) {
    group = "screenshots"
    description = "Captures the Wear store screenshots on the round emulator ANDROID_SERIAL names " +
            "and copies them into fastlane/metadata."
    dependsOn "cleanWearScreenshotOutput", ":watchface:installDebug", "connectedDebugAndroidTest"
    from(wearScreenshotOutput) {
        include "**/wear-store-screenshots/*.png"
        eachFile { it.path = it.name }
        includeEmptyDirs = false
    }
    into "${rootDir}/fastlane/metadata/android/en-US/images/wearScreenshots"
}
